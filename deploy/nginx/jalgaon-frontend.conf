server {
    # Listen on HTTP port 80
    # After SSL is set up, certbot will update this to redirect to HTTPS
    listen 80;
    server_name www.jalgaon.com jalgaon.com;

    # ==========================================================================
    # NOTE: This config now serves the NEW Next.js SSR frontend (New-JalgaonUI).
    # Instead of serving static files directly, Nginx acts as a reverse proxy
    # to the Next.js server running on localhost:3000 (nextjs_jalgaon systemd).
    # This is the same pattern used for Django/Gunicorn on api.jalgaon.com.
    # ==========================================================================

    # ── Next.js Hashed Static Assets ──────────────────────────────────────────
    # Next.js adds content hashes to JS/CSS in /_next/static/ (e.g., page-abc123.js)
    # These are safe to cache for 1 year — identical to Vite's /assets/ pattern.
    location /_next/static/ {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Next.js Image Optimization Endpoint ───────────────────────────────────
    # Next.js serves optimised WebP/AVIF images at /_next/image
    location /_next/image {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── All Requests → Next.js Server ─────────────────────────────────────────
    # Handles: pages (/, /events, /news, /jobs, /ngo, /admin),
    #          API routes (/api/dashboard, /api/businesses),
    #          and all other Next.js server-rendered content.
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;

        # Required for WebSocket support (Next.js HMR uses this in dev;
        # kept here for forward-compatibility with streaming/server-sent events)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
