# =============================================================================
# Nginx Config — www.jalgaon.com / jalgaon.com (Next.js Frontend)
# =============================================================================
#
# ARCHITECTURE: CloudFront → Lightsail (Nginx)
#
# CloudFront sits in front of this server. It:
#   1. Terminates HTTPS from users at the CDN edge
#   2. Handles HTTP → HTTPS redirect at the CDN level (already working)
#   3. Connects to THIS server (origin) via HTTP on port 80
#
# CRITICAL: Do NOT put a HTTP→HTTPS redirect on port 80 in Nginx.
# CloudFront sends all origin traffic via HTTP (port 80). If Nginx
# redirects port 80 → HTTPS, it creates an infinite redirect loop
# (CloudFront → Nginx 301 → CloudFront again → Nginx 301 → ...).
#
# Rule:  HTTP redirect enforcement = CloudFront's job (done at CDN edge)
#        Serving the app = Nginx's job
#
# Port 80 block: Serves the Next.js app for CloudFront origin connections
# Port 443 block: Serves the Next.js app for any direct HTTPS connections
# =============================================================================


# ── Block 1: Port 80 — CloudFront Origin Connection ──────────────────────────
# CloudFront connects to origin via HTTP. Nginx must serve normally here.
# DO NOT add return 301 https:// here — it causes redirect loop with CloudFront.
server {
    listen 80;
    listen [::]:80;
    server_name www.jalgaon.com jalgaon.com;

    # Let certbot handle ACME challenge for certificate auto-renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Canonical: non-www → www (preserves current scheme, not forced to HTTPS)
    if ($host = jalgaon.com) {
        return 301 $scheme://www.jalgaon.com$request_uri;
    }

    # ── Next.js Hashed Static Assets ─────────────────────────────────────────
    location /_next/static/ {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Next.js Image Optimization ────────────────────────────────────────────
    location /_next/image {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # ── All Requests → Next.js App ────────────────────────────────────────────
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Forward the original scheme so Next.js knows user is on HTTPS via CloudFront
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}


# ── Block 2: Port 443 — Direct HTTPS Access (bypassing CloudFront) ────────────
# Handles direct access to the server IP or if CloudFront origin is set to HTTPS.
# SSL certificate managed by Let's Encrypt / certbot.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.jalgaon.com jalgaon.com;

    # SSL Certificate (managed by certbot — do NOT edit manually)
    ssl_certificate /etc/letsencrypt/live/www.jalgaon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.jalgaon.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Canonical: non-www → www (force HTTPS www as canonical)
    if ($host = jalgaon.com) {
        return 301 https://www.jalgaon.com$request_uri;
    }

    # Security headers (HSTS only on HTTPS block — not port 80)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ── Next.js Hashed Static Assets ─────────────────────────────────────────
    location /_next/static/ {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Next.js Image Optimization ────────────────────────────────────────────
    location /_next/image {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ── All Requests → Next.js App ────────────────────────────────────────────
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
    }
}
