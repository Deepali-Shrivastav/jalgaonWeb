# =============================================================================
# Nginx Config — www.jalgaon.com / jalgaon.com (Next.js Frontend)
# =============================================================================
#
# Architecture:
#   Block 1 (port 80): Catch ALL HTTP traffic → redirect to HTTPS (301)
#   Block 2 (port 443): Serve the actual Next.js app over SSL
#
# SSL certificates are managed by Let's Encrypt / certbot.
# After certbot runs, it fills in the ssl_certificate paths below.
#
# Certbot command used to generate/renew:
#   sudo certbot --nginx -d www.jalgaon.com -d jalgaon.com
# =============================================================================


# ── Block 1: HTTP → HTTPS redirect (port 80) ─────────────────────────────────
# Catches http://jalgaon.com and http://www.jalgaon.com
# Both are permanently redirected (301) to https://www.jalgaon.com
# This block is intentionally minimal — do NOT add proxy logic here.
server {
    listen 80;
    listen [::]:80;
    server_name jalgaon.com www.jalgaon.com;

    # Let certbot handle ACME challenge for certificate renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS www
    location / {
        return 301 https://www.jalgaon.com$request_uri;
    }
}


# ── Block 2: HTTPS Server (port 443) ─────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jalgaon.com www.jalgaon.com;

    # ── SSL Certificate (managed by certbot) ──────────────────────────────────
    # certbot fills these paths automatically when it issues the certificate.
    # Do NOT edit these manually.
    ssl_certificate /etc/letsencrypt/live/www.jalgaon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.jalgaon.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Canonical domain: non-www → www redirect ──────────────────────────────
    # http://jalgaon.com and https://jalgaon.com both redirect to https://www.jalgaon.com
    if ($host = jalgaon.com) {
        return 301 https://www.jalgaon.com$request_uri;
    }

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS: tell browsers to always use HTTPS for 1 year (only active over SSL)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ── Next.js Hashed Static Assets ──────────────────────────────────────────
    # Next.js adds content hashes to JS/CSS in /_next/static/ (e.g., page-abc123.js)
    # These are safe to cache for 1 year — identical hash = identical content.
    location /_next/static/ {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Next.js Image Optimization Endpoint ───────────────────────────────────
    location /_next/image {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── All Requests → Next.js Server ─────────────────────────────────────────
    # Handles all pages, API routes (/api/dashboard etc.), and SSR content.
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;

        # WebSocket support (Next.js HMR in dev; kept for streaming/SSE compatibility)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
    }
}
