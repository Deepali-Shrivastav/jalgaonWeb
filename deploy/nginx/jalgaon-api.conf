# =============================================================================
# Nginx Config — api.jalgaon.com (Django Backend / Gunicorn)
# =============================================================================
#
# ARCHITECTURE: CloudFront → Lightsail (Nginx → Gunicorn)
#
# CloudFront sits in front of this server. It:
#   1. Terminates HTTPS from users at the CDN edge
#   2. Handles HTTP → HTTPS redirect at the CDN level
#   3. Connects to THIS server (origin) via HTTP on port 80
#
# CRITICAL: Do NOT put a HTTP→HTTPS redirect on port 80 in Nginx.
# Same reason as the frontend — would cause an infinite redirect loop.
#
# Port 80 block: Serves Django API for CloudFront origin connections
# Port 443 block: Serves Django API for any direct HTTPS connections
# =============================================================================


# ── Block 1: Port 80 — CloudFront Origin Connection ──────────────────────────
# CloudFront connects to origin via HTTP. Nginx must serve normally here.
# DO NOT add return 301 https:// here — it causes redirect loop with CloudFront.
server {
    listen 80;
    listen [::]:80;
    server_name api.jalgaon.com;
    
    # Allow large file uploads for blogs, media, etc.
    client_max_body_size 50M;

    # Let certbot handle ACME challenge for certificate auto-renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https:; frame-ancestors 'none';" always;

    # ── Django Media Files ────────────────────────────────────────────────────
    location /media/ {
        alias /home/ubuntu/jalgaonWeb/jalgaonApi/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # ── Django Static Files ───────────────────────────────────────────────────
    location /static/ {
        alias /home/ubuntu/jalgaonWeb/jalgaonApi/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── All API Requests → Gunicorn ───────────────────────────────────────────
    location / {
        proxy_pass http://unix:/run/gunicorn/gunicorn_jalgaon.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Forward the original scheme so Django knows user is on HTTPS via CloudFront
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
    }
}


# ── Block 2: Port 443 — Direct HTTPS Access (bypassing CloudFront) ────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.jalgaon.com;

    # Allow large file uploads for blogs, media, etc.
    client_max_body_size 50M;

    # SSL Certificate (managed by certbot — do NOT edit manually)
    # All 3 domains (www.jalgaon.com, jalgaon.com, api.jalgaon.com) share ONE
    # certificate issued by certbot. It is stored under the primary domain (www).
    ssl_certificate /etc/letsencrypt/live/www.jalgaon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.jalgaon.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # HSTS only on HTTPS block — telling browsers to always use HTTPS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https:; frame-ancestors 'none';" always;

    # ── Django Media Files ────────────────────────────────────────────────────
    location /media/ {
        alias /home/ubuntu/jalgaonWeb/jalgaonApi/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # ── Django Static Files ───────────────────────────────────────────────────
    location /static/ {
        alias /home/ubuntu/jalgaonWeb/jalgaonApi/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── All API Requests → Gunicorn ───────────────────────────────────────────
    location / {
        proxy_pass http://unix:/run/gunicorn/gunicorn_jalgaon.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
    }
}
