# =============================================================================
# Nginx Config — api.jalgaon.com (Django Backend / Gunicorn)
# =============================================================================
#
# Architecture:
#   Block 1 (port 80): Catch ALL HTTP traffic → redirect to HTTPS (301)
#   Block 2 (port 443): Serve the Django API over SSL
#
# SSL certificates are managed by Let's Encrypt / certbot.
# After certbot runs, it fills in the ssl_certificate paths below.
#
# Certbot command used to generate/renew:
#   sudo certbot --nginx -d api.jalgaon.com
# =============================================================================


# ── Block 1: HTTP → HTTPS redirect (port 80) ─────────────────────────────────
# Catches http://api.jalgaon.com → redirects permanently to https://api.jalgaon.com
server {
    listen 80;
    listen [::]:80;
    server_name api.jalgaon.com;

    # Let certbot handle ACME challenge for certificate renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://api.jalgaon.com$request_uri;
    }
}


# ── Block 2: HTTPS Server (port 443) ─────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.jalgaon.com;

    # ── SSL Certificate (managed by certbot) ──────────────────────────────────
    # certbot fills these paths automatically when it issues the certificate.
    # Do NOT edit these manually.
    ssl_certificate /etc/letsencrypt/live/api.jalgaon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.jalgaon.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # HSTS: tell browsers to always use HTTPS for 1 year
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https:; frame-ancestors 'none';" always;

    # ── Django Media Files ────────────────────────────────────────────────────
    # User-uploaded images (profile pics, business banners, etc.)
    # Served directly by Nginx — never goes to Gunicorn.
    location /media/ {
        alias /home/ubuntu/jalgaonWeb/jalgaonApi/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # ── Django Static Files ───────────────────────────────────────────────────
    # Admin panel CSS/JS from 'python manage.py collectstatic'
    # Served directly by Nginx — never goes to Gunicorn.
    location /static/ {
        alias /home/ubuntu/jalgaonWeb/jalgaonApi/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── All API Requests → Gunicorn (Unix socket) ─────────────────────────────
    location / {
        proxy_pass http://unix:/run/gunicorn/gunicorn_jalgaon.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
    }
}
