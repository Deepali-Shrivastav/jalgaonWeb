name: "Operations — Seed Clubs Data (Manual Run)"

on:
  workflow_dispatch:  # Manual trigger button in GitHub Actions UI

jobs:
  seed-clubs:
    name: "Seed Clubs & Categories → Production Database"
    runs-on: ubuntu-22.04

    steps:
      - name: "Run Seed Clubs Command on Lightsail Server"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_SERVER_IP }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -euo pipefail
            
            REPO_DIR="/home/ubuntu/jalgaonWeb"
            API_DIR="${REPO_DIR}/jalgaonApi"
            VENV="${API_DIR}/.venv/bin/activate"

            echo "=== [1/3] Pulling latest code from main branch ==="
            cd "${REPO_DIR}"
            git fetch origin main
            git reset --hard origin/main

            echo "=== [2/3] Activating venv and running seed command ==="
            source "${VENV}"
            cd "${API_DIR}"
            DJANGO_ENV=production python manage.py seed_clubs

            echo "=== [3/3] Done ==="
            echo "✅ Clubs data seeded successfully!"
