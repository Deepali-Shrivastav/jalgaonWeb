# =============================================================================
# Workflow 3 of 3: CD — Deploy Next.js Frontend (New-JalgaonUI) to Production
# =============================================================================
# Triggers on:
#   - Push/merge to 'main' branch, ONLY when New-JalgaonUI/ files changed (auto)
#   - Manual button in GitHub Actions UI (manual)
#
# Target: jalgaon-webapp Lightsail server — 13.127.8.145
# Service: nextjs_jalgaon (systemd) running on localhost:3000
# Nginx: Reverse-proxies www.jalgaon.com → localhost:3000
#
# Architecture change vs previous version (jalgaonUi):
#   OLD: Vite static build → SCP tarball → extract to /var/www → nginx reload
#   NEW: Next.js SSR → SSH build-on-server → systemctl restart nextjs_jalgaon
#
# Why build on the server instead of CI runner?
#   1. Next.js SSR requires node_modules at runtime (can't just copy static files)
#   2. .env.production with secret API keys (COMMODITY/WEATHER) lives on the server
#   3. NEXT_PUBLIC_* vars are baked in at build time — server already has them
#   4. Avoids SCP-ing hundreds of MBs of .next/ build artifacts
#
# Safety gates:
#   1. Pre-deploy build runs on the CI runner first (fails fast before SSH)
#   2. Post-deploy health check verifies the service is running
#   3. Concurrency lock prevents two deploys running simultaneously
# =============================================================================
name: "CD — Deploy New-JalgaonUI (Next.js) to Production"

on:
  push:
    branches:
      - main
    paths:
      - "New-JalgaonUI/**"
      - ".github/workflows/deploy-frontend.yml"

  # ✅ Manual trigger button
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deployment"
        required: true
        default: "Hotfix / manual deploy"

# Prevent two frontend deploys running simultaneously
concurrency:
  group: production-frontend-deploy
  cancel-in-progress: false

jobs:
  deploy-frontend:
    name: "Build & Deploy Next.js App → jalgaon-webapp (13.127.8.145)"
    runs-on: ubuntu-22.04

    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      # -----------------------------------------------------------------------
      # STEP 1: Checkout the repository
      # -----------------------------------------------------------------------
      - name: "Checkout code"
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # STEP 2: Pre-deploy build check on the CI runner
      # This catches TypeScript errors and build failures BEFORE touching the
      # production server. Fast failure saves SSH time and protects the server.
      # -----------------------------------------------------------------------
      - name: "Set up Node.js 20 LTS"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: New-JalgaonUI/package-lock.json

      - name: "Install frontend dependencies (pre-deploy check)"
        working-directory: New-JalgaonUI
        run: npm ci

      - name: "Pre-deploy: build check (catches TS/build errors before SSH)"
        working-directory: New-JalgaonUI
        env:
          # NEXT_PUBLIC_* vars are baked in at build time.
          # We inject the production value here so the CI build matches production.
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          npm run build
          echo "✅ Pre-deploy build check passed — no TypeScript or build errors"

      # -----------------------------------------------------------------------
      # STEP 3: SSH to the production server and deploy
      #
      # The actual deployment runs on the server:
      #   1. git pull — gets the latest code (including New-JalgaonUI/)
      #   2. Write .env.production — injects secrets safely via envs:
      #   3. npm ci --omit=dev — install production dependencies
      #   4. npm run build — builds Next.js (reads .env.production for NEXT_PUBLIC_*)
      #   5. systemctl restart — restarts the nextjs_jalgaon systemd service
      #   6. Health check — fails the deploy if the service didn't come up
      # -----------------------------------------------------------------------
      - name: "Deploy to jalgaon-webapp Lightsail server"
        uses: appleboy/ssh-action@v1.0.3
        # CRITICAL: Pass secrets as shell env vars (not raw interpolated strings).
        # This is safe even when values contain $, \, `, or " characters.
        env:
          DEPLOY_NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          DEPLOY_COMMODITY_KEY: ${{ secrets.COMMODITY_PRICE_API_KEY }}
          DEPLOY_WEATHER_KEY: ${{ secrets.WEATHERAPI_KEY }}
        with:
          host: ${{ secrets.PRODUCTION_SERVER_IP }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: 22
          command_timeout: 20m
          envs: DEPLOY_NEXT_PUBLIC_API_URL,DEPLOY_COMMODITY_KEY,DEPLOY_WEATHER_KEY
          script: |
            set -euo pipefail

            REPO_DIR="/home/ubuntu/jalgaonWeb"
            NEXT_DIR="${REPO_DIR}/New-JalgaonUI"
            ENV_FILE="${NEXT_DIR}/.env.production"

            echo "=== [1/6] Pulling latest code from main branch ==="
            cd "${REPO_DIR}"
            git fetch origin main
            git reset --hard origin/main
            echo "✅ Code updated to: $(git log -1 --oneline)"

            echo "=== [2/6] Writing .env.production from deployment secrets ==="
            # Write env file using injected env vars (safe with special characters)
            {
              echo "NEXT_PUBLIC_API_URL=${DEPLOY_NEXT_PUBLIC_API_URL}"
              echo "COMMODITY_PRICE_API_KEY=${DEPLOY_COMMODITY_KEY}"
              echo "WEATHERAPI_KEY=${DEPLOY_WEATHER_KEY}"
            } > "${ENV_FILE}"
            chmod 600 "${ENV_FILE}"
            echo "✅ .env.production written (permissions: 600)"

            echo "=== [3/6] Installing dependencies ==="
            cd "${NEXT_DIR}"
            npm ci
            echo "✅ Dependencies installed"

            echo "=== [4/6] Building Next.js application ==="
            # npm run build reads .env.production for NEXT_PUBLIC_* vars and bakes them in.
            # COMMODITY_PRICE_API_KEY and WEATHERAPI_KEY are runtime-only (no NEXT_PUBLIC_ prefix).
            npm run build
            echo "✅ Next.js build complete"

            echo "=== [5/6] Restarting Next.js systemd service ==="
            sudo systemctl stop nextjs_jalgaon || true
            sleep 2
            sudo systemctl start nextjs_jalgaon
            sleep 5  # Give the server time to start listening on port 3000

            echo "=== [6/6] Health check — verifying service is running ==="
            if sudo systemctl is-active --quiet nextjs_jalgaon; then
              echo "✅ nextjs_jalgaon is running — deployment successful"
            else
              echo "❌ ERROR: nextjs_jalgaon failed to start. Last 30 log lines:"
              sudo journalctl -u nextjs_jalgaon --no-pager -n 30
              exit 1
            fi

            echo ""
            echo "🚀 Frontend deployment completed successfully"
            echo "   Deployed commit: $(git -C ${REPO_DIR} log -1 --oneline)"
            echo "   Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
