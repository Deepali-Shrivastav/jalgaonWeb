# =============================================================================
# Workflow: CD — Deploy Next.js Frontend (New-JalgaonUI) to Production
# =============================================================================
#
# Architecture (Industry Standard — Build on CI, Deploy Artifacts):
#
#   OLD (problematic): Build on server → OOM kills on low-RAM server
#   NEW (correct):     Build on CI runner (7 GB RAM) → transfer artifact → deploy
#
# Why build on CI runner, not the server?
#   - GitHub Actions runners have 7 GB RAM; the server has ~2 GB free
#   - The Next.js build is memory-intensive and caused OOM kills on the server
#   - The server should only RUN the built app, never BUILD it
#
# Deployment flow:
#   1. Build .next/ on CI runner (no server RAM used)
#   2. Package built artifacts into a tarball
#   3. SCP tarball to server (~20-50 MB compressed)
#   4. Server: unpack → npm ci --omit=dev → systemctl restart (graceful)
#   5. Health check with automatic rollback on failure
#
# Downtime: ~10-15 seconds (service restart only, no build wait)
# =============================================================================
name: "CD — Deploy New-JalgaonUI (Next.js) to Production"

on:
  push:
    branches:
      - main
    paths:
      - "New-JalgaonUI/**"
      - ".github/workflows/deploy-frontend.yml"

  # Manual trigger
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deployment"
        required: true
        default: "Hotfix / manual deploy"

# Prevent two deploys running simultaneously
concurrency:
  group: production-frontend-deploy
  cancel-in-progress: false

jobs:
  deploy-frontend:
    name: "Build & Deploy Next.js App → jalgaon-webapp (13.127.8.145)"
    runs-on: ubuntu-22.04

    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      # ── Step 1: Checkout ────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Step 2: Set up Node.js ──────────────────────────────────────────────
      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: New-JalgaonUI/package-lock.json

      # ── Step 3: Install dependencies ────────────────────────────────────────
      - name: Install frontend dependencies
        working-directory: New-JalgaonUI
        run: npm ci

      # ── Step 4: Build on CI runner ──────────────────────────────────────────
      # GitHub Actions runners have 7 GB RAM — build here, not on the server.
      # NEXT_PUBLIC_* vars are baked into the JS bundle at build time.
      - name: Build Next.js application
        working-directory: New-JalgaonUI
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: |
          npm run build
          echo "✅ Build complete"

      # ── Step 5: Package build artifacts ─────────────────────────────────────
      # Ship only what the production server needs to RUN the app.
      # Source files, dev dependencies, and TypeScript are NOT needed at runtime.
      - name: Package build artifacts
        run: |
          tar -czf next-deploy.tar.gz \
            -C New-JalgaonUI \
            .next \
            public \
            package.json \
            package-lock.json \
            next.config.ts
          echo "📦 Artifact size: $(du -h next-deploy.tar.gz | cut -f1)"

      # ── Step 6: Upload artifact to production server ─────────────────────────
      - name: Upload build artifact to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_SERVER_IP }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: 22
          source: "next-deploy.tar.gz"
          target: "/tmp/"

      # ── Step 7: Deploy on server ─────────────────────────────────────────────
      # The server does NOT build. It only:
      #   1. Writes runtime secrets to .env.production
      #   2. Unpacks the pre-built .next/ artifact
      #   3. Installs production-only node_modules (fast, no compile)
      #   4. Restarts the systemd service gracefully
      #   5. Health-checks and rolls back automatically on failure
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          DEPLOY_COMMODITY_KEY: ${{ secrets.COMMODITY_PRICE_API_KEY }}
          DEPLOY_WEATHER_KEY: ${{ secrets.WEATHERAPI_KEY }}
        with:
          host: ${{ secrets.PRODUCTION_SERVER_IP }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: 22
          command_timeout: 10m
          envs: DEPLOY_NEXT_PUBLIC_API_URL,DEPLOY_COMMODITY_KEY,DEPLOY_WEATHER_KEY
          script: |
            set -euo pipefail

            NEXT_DIR="/home/ubuntu/jalgaonWeb/New-JalgaonUI"
            DEPLOY_PKG="/tmp/next-deploy.tar.gz"

            # ── [1/4] Write runtime secrets ──────────────────────────────────
            echo "=== [1/4] Writing runtime secrets to .env.production ==="
            {
              echo "NEXT_PUBLIC_API_URL=${DEPLOY_NEXT_PUBLIC_API_URL}"
              echo "COMMODITY_PRICE_API_KEY=${DEPLOY_COMMODITY_KEY}"
              echo "WEATHERAPI_KEY=${DEPLOY_WEATHER_KEY}"
            } > "${NEXT_DIR}/.env.production"
            chmod 600 "${NEXT_DIR}/.env.production"
            echo "✅ .env.production written (permissions: 600)"

            # ── [2/4] Deploy artifacts ───────────────────────────────────────
            echo "=== [2/4] Deploying build artifacts ==="
            # Keep previous .next/ for rollback (instant rename, no disk copy)
            [ -d "${NEXT_DIR}/.next" ] && \
              mv "${NEXT_DIR}/.next" "${NEXT_DIR}/.next.prev" || true
            # Unpack new build
            tar -xzf "${DEPLOY_PKG}" -C "${NEXT_DIR}/"
            rm -f "${DEPLOY_PKG}"
            echo "✅ Build artifacts in place"

            # ── [3/4] Install production dependencies ────────────────────────
            # --omit=dev skips devDependencies — fast, no compile step.
            # The server NEVER runs the Next.js build.
            echo "=== [3/4] Installing production dependencies ==="
            cd "${NEXT_DIR}"
            npm ci --omit=dev
            echo "✅ Production dependencies installed"

            # ── [4/4] Graceful service restart ───────────────────────────────
            echo "=== [4/4] Restarting Next.js service ==="
            sudo systemctl restart nextjs_jalgaon
            sleep 12

            # ── Health check with automatic rollback ─────────────────────────
            echo "=== Health check ==="
            if sudo systemctl is-active --quiet nextjs_jalgaon; then
              rm -rf "${NEXT_DIR}/.next.prev" 2>/dev/null || true
              echo "✅ nextjs_jalgaon is active — deployment successful"
              echo ""
              echo "🚀 Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            else
              echo "❌ Service failed to start. Initiating automatic rollback..."
              if [ -d "${NEXT_DIR}/.next.prev" ]; then
                mv "${NEXT_DIR}/.next" "${NEXT_DIR}/.next.failed" 2>/dev/null || true
                mv "${NEXT_DIR}/.next.prev" "${NEXT_DIR}/.next"
                sudo systemctl restart nextjs_jalgaon 2>/dev/null || true
                echo "⚠️  Rolled back to previous build"
              fi
              echo "❌ Deployment failed. Last 30 log lines:"
              sudo journalctl -u nextjs_jalgaon --no-pager -n 30
              exit 1
            fi
